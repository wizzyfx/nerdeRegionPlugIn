<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NerdeRegion Panel</title>
  </head>
  <body>
    <div id="wrapper" class="light">
      <div
        class="toolbar"
        role="toolbar"
        aria-label="NerdeRegion Controls"
        id="toolbar"
      >
        <button class="toolbarButton" type="button" id="resetButton">
          <span aria-hidden="true" class="icon reset"></span>
          <span>Reset</span>
        </button>
        <div class="separator"></div>
        <label class="toolbarButton">
          <input type="checkbox" id="preserveToggle" />
          <span>Preserve Log</span>
        </label>
        <label class="toolbarButton">
          <input type="checkbox" id="nameToggle" />
          <span>Calculate Name (Beta)</span>
        </label>
        <button
          class="toolbarButton"
          type="button"
          style="margin-left: auto"
          id="aboutButton"
        >
          <span aria-hidden="true" class="icon info"></span>
          <span class="visually-hidden">About</span>
        </button>
      </div>
      <div id="logs">
        <ul id="regions" role="tablist">
          <li role="none">
            <button
              role="tab"
              aria-selected="true"
              aria-controls="events"
              class="tab all active"
            >
              All Regions
            </button>
          </li>
        </ul>
        <div id="events" role="tabpanel" aria-label="Live Region Log">
          <ol>dddd</ol>
        </div>
      </div>
    </div>
  </body>
</html>
